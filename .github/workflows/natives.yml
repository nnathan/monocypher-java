name: natives

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - run: scripts/docker-build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: natives
          path: |
            build/native
            build/smoke
            build/monocypher-java.jar
            build/monocypher-android.aar

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - run: scripts/test-sanitizers.sh

  clang-tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - run: sudo apt-get update && sudo apt-get install -y clang-tidy
      # Reports only for now: the unconverted groups still have known warnings.
      - run: clang-tidy -quiet src/main/c/*.c -- -Ivendor/monocypher/src -Isrc/main/c -Ithird_party/jni -Ithird_party/jni/unix

  smoke-linux:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: natives
          path: build
      - uses: docker/setup-qemu-action@v3
      - run: scripts/smoke-linux.sh

  smoke-host:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, target: macos-arm64, lib: libmonocypher_jni.dylib, distribution: zulu, java: "8", arch: aarch64 }
          - { os: macos-15, target: macos-arm64, lib: libmonocypher_jni.dylib, distribution: temurin, java: "25", arch: aarch64 }
          - { os: macos-15-intel, target: macos-x86_64, lib: libmonocypher_jni.dylib, distribution: temurin, java: "8", arch: x64 }
          - { os: windows-latest, target: windows-x86_64, lib: monocypher_jni.dll, distribution: temurin, java: "8", arch: x64 }
          - { os: windows-latest, target: windows-x86_64, lib: monocypher_jni.dll, distribution: temurin, java: "25", arch: x64 }
          - { os: windows-latest, target: windows-x86, lib: monocypher_jni.dll, distribution: temurin, java: "8", arch: x86 }
          # Java 8 has no Windows arm64 build, and setup-java has no Temurin 25 for it yet.
          - { os: windows-11-arm, target: windows-arm64, lib: monocypher_jni.dll, distribution: temurin, java: "21", arch: aarch64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: natives
          path: build
      - uses: actions/setup-java@v4
        with:
          distribution: ${{ matrix.distribution }}
          java-version: ${{ matrix.java }}
          architecture: ${{ matrix.arch }}
      - run: java -cp "build/smoke${{ runner.os == 'Windows' && ';' || ':' }}build/monocypher-java.jar" Smoke
        shell: bash

  smoke-android:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: natives
          path: build
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          script: scripts/smoke-android.sh
